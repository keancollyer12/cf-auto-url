name: Run Docker with URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'sxyprn post URL'
        required: true
        type: string

jobs:
  run-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Docker image
        run: docker pull ghcr.io/keancollyer12/cf-auto-url:latest

      - name: Run Docker container
        run: docker run --rm ghcr.io/keancollyer12/cf-auto-url:latest "${{ inputs.url }}"
